[project]
name = "kalshi-data"
version = "0.1.0"
description = "Kalshi market structure analysis - data foundation (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.27",
    "polars>=1.0",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
